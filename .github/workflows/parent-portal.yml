name: Parent Portal checks
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/parent-portal.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/parent-portal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify output
        run: |
          test -s dist/index.html
          test -s dist/_headers
          test -s dist/app.js
          test -s dist/styles.css
